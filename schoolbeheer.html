<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schoolbeheer – De Linde</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --ink:#0b2341;--muted:#50658a;--line:#d7e0ec;--soft:#f4f7fb;
      --yellow:#ffdc63;--yellow-dark:#d5ad1f;--green:#bcebdc;--pink:#f6bec6;
      --blue:#e9f0f8;--white:#fff;--sidebar-bg:#f0f4f9;--sidebar-w:210px;
      --header-h:62px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f6f8fc;display:flex;flex-direction:column;min-height:100vh}

    /* ── TOPBAR ── */
    #topbar{
      height:var(--header-h);display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;background:linear-gradient(135deg,#6b5d52 0%,#8a7a6d 100%);color:#fff;flex-shrink:0;gap:12px;
    }
    #topbar .brand{font-size:16px;font-weight:800;white-space:nowrap}
    #topbar .meta{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #topbar .tools{display:flex;gap:8px;align-items:center;flex-shrink:0}
    #topbar .tools button{
      background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
      color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;
    }
    #topbar .tools button:hover{background:rgba(255,255,255,.25)}
    #topbar .pill-status{
      font-size:12px;padding:4px 10px;border-radius:999px;
      background:rgba(255,255,255,.15);white-space:nowrap;
    }
    #topbar .pill-status.saved{background:#bcebdc;color:#0b2341}

    /* ── LAYOUT ── */
    #shell{display:flex;flex:1;overflow:hidden}

    /* ── SIDEBAR ── */
    #sidebar{
      width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);
      border-right:1px solid var(--line);display:flex;flex-direction:column;
      overflow-y:auto;
    }
    .sb-section{padding:10px 0}
    .sb-label{
      font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
      color:var(--muted);padding:6px 16px 4px;
    }
    .sb-item{
      display:flex;align-items:center;gap:9px;padding:9px 16px;
      font-size:14px;cursor:pointer;color:var(--ink);
      border-left:3px solid transparent;transition:background .12s;
    }
    .sb-item:hover{filter:brightness(.95)}
    .sb-item.active{font-weight:800;filter:brightness(.92)}

    /* Altijd zichtbare kleur per module */
    #navAdministratie{background:#fdf0e8;border-left-color:#d4845a;color:#7a3a1a}
    #navAdministratie .sb-icon{color:#d4845a}
    #navAdministratie.active{background:#fae0cc;border-left-color:#a0522d}

    #navKlaslijst{background:#eaf4ec;border-left-color:#5a8a63;color:#2d5c35}
    #navKlaslijst .sb-icon{color:#5a8a63}
    #navKlaslijst.active{background:#d4ecda;border-left-color:#3d6b47}
    .wegwijzer-intro{background:linear-gradient(135deg,#eef8f0,#f7fbff);border:1px solid #cfe2d3;border-radius:16px;padding:18px;margin-bottom:16px}
    .wegwijzer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
    .wegwijzer-kaart{border:1px solid #dfe5e1;border-radius:14px;background:#fff;overflow:hidden}
    .wegwijzer-kaart summary{cursor:pointer;padding:15px 16px;font-weight:800;list-style:none;display:flex;gap:10px;align-items:center}
    .wegwijzer-kaart summary::-webkit-details-marker{display:none}.wegwijzer-kaart summary::after{content:'+';margin-left:auto;font-size:20px;color:#55705c}.wegwijzer-kaart[open] summary::after{content:'−'}
    .wegwijzer-inhoud{padding:0 16px 16px;border-top:1px solid #edf0ee}.wegwijzer-inhoud ol{padding-left:20px;line-height:1.6}.wegwijzer-inhoud li+li{margin-top:5px}
    .wegwijzer-waarschuwing{background:#fff8e6;border-left:4px solid #e0a229;padding:10px 12px;border-radius:8px;margin:10px 0}
    .wegwijzer-keuzes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .wegwijzer-keuze{border:1px solid #d6e1da;background:#fff;border-radius:14px;padding:15px;text-align:left;cursor:pointer;color:#173424;display:flex;gap:11px;align-items:center;min-height:76px}
    .wegwijzer-keuze:hover,.wegwijzer-keuze.active{border-color:#5c9870;background:#edf7f0;box-shadow:0 4px 12px #214f3020}
    .wegwijzer-keuze .icoon{font-size:25px}.wegwijzer-keuze strong,.wegwijzer-keuze small{display:block}.wegwijzer-keuze small{font-weight:500;color:#63736a;margin-top:3px;line-height:1.3}
    .wegwijzer-terug{margin:0 0 12px}.wegwijzer-verborgen{display:none!important}
    @media(max-width:900px){.wegwijzer-keuzes{grid-template-columns:1fr}}
    .scherm-laden{position:fixed;inset:0;background:rgba(244,247,251,.9);z-index:10000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}.scherm-laden.show{display:flex}.scherm-laden-kaart{width:min(360px,88vw);background:#fff;border:1px solid #d7e0e9;border-radius:16px;padding:20px;text-align:center;box-shadow:0 12px 40px #31445b2b}.laadbalk{height:7px;background:#e8edf2;border-radius:99px;overflow:hidden;margin-top:13px}.laadbalk::after{content:'';display:block;width:42%;height:100%;background:#4f8b68;border-radius:99px;animation:laadSchuif 1s ease-in-out infinite}@keyframes laadSchuif{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}

    #navRefter{background:#fdf4e0;border-left-color:#d99040;color:#7a5010}
    #navRefter .sb-icon{color:#d99040}
    #navRefter.active{background:#fae8c0;border-left-color:#a06010}

    #navActiviteiten{background:#edf0fa;border-left-color:#6b7abf;color:#3d4f99}
    #navActiviteiten .sb-icon{color:#6b7abf}
    #navActiviteiten.active{background:#d8ddf5;border-left-color:#3d4f99}

    #navAankopen{background:#faedf2;border-left-color:#c05a7a;color:#7a2a4a}
    #navAankopen .sb-icon{color:#c05a7a}
    #navAankopen.active{background:#f5d0dc;border-left-color:#8a2a4a}
    #navLeerlingen{background:#edf7f1;border-left-color:#4c9b70;color:#245f40}
    #navLeerlingen.active{background:#d8efe2;border-left-color:#28794d}
    #navOpvolging{background:#fff7df;border-left-color:#d5a52c;color:#71570d}
    #navOpvolging.active{background:#ffedb4;border-left-color:#a87900}
    .maandmappen{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}
    .maandmap{border:1px solid #cbd8e6;border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(31,55,80,.05);min-height:126px}
    .maandmap.heeft-open{border:2px solid #e0a600;background:#fffaf0}
    .maandmap summary{cursor:pointer;list-style:none;padding:29px 18px 17px;font-size:18px;font-weight:850;display:flex;align-items:center;gap:10px;position:relative;height:124px;box-sizing:border-box}
    .maandmap[open] summary{height:124px}
    .maandmap summary::-webkit-details-marker{display:none}
    .maandmap summary::before{content:'📁';font-size:25px;margin-right:7px}
    .maandmap[open] summary::before{content:'📂'}
    .maandmap-status{position:absolute;top:7px;right:9px;font-size:12px;line-height:1;border:1px solid #dca900;border-radius:999px;background:#fff0b8;color:#684d00;padding:5px 8px;white-space:nowrap;z-index:1}
    .maandmap-inhoud{border-top:1px solid #d9e2ec;padding:12px;display:grid;gap:9px}
    .maandmap-knop{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:#f6f8fb;border:1px solid #d5dfe9;color:#17324d;padding:12px 13px;border-radius:11px}
    .maandmap-knop.nieuw{background:#fff0bd;border-color:#dca900;color:#684d00}
    .maandmap-knop.verwerkt{background:#edf8f1;border-color:#acd4bc;color:#22633f}
    .maandmap-knop small{display:block;font-weight:600;opacity:.82;margin-top:2px}
    .maand-onderdeel-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 16px;padding:10px;background:#f4f7fa;border:1px solid #ccd9e5;border-radius:13px}
    .maand-onderdeel-nav .actief{background:#ffe08a;border-color:#d7a600;color:#604700}
    .opvolg-keuzes{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:15px;margin-top:16px}
    .opvolg-keuzes button.heeft-open{background:#fff0b8;border-color:#dca900;color:#674c00}
    @media(max-width:900px){.opvolg-keuzes{grid-template-columns:1fr}.maandmappen{grid-template-columns:1fr 1fr}}

    #navOudsten{background:#edf7f1;border-left-color:#4f9a70;color:#285c3e}
    #navOudsten .sb-icon{color:#4f9a70}
    #navOudsten.active{background:#d8efe1;border-left-color:#2f7951}


    .sb-item .sb-icon{font-size:17px;width:20px;text-align:center;flex-shrink:0}
    .sb-divider{height:1px;background:var(--line);margin:4px 12px}

    /* klas-picker in sidebar */
    .sb-klas-wrap{padding:10px 12px 14px}
    .sb-klas-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .sb-klas-btn{
      padding:5px 10px;border-radius:10px;border:1px solid var(--line);
      background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);
    }
    .sb-klas-btn.active{background:#6b5d52;color:#fff;border-color:#6b5d52}
    .sb-klas-btn:hover:not(.active){background:#dde5f0}
    .sb-klas-btn.has-test{border:2px solid #d99b00;background:#fff1b8;box-shadow:0 0 0 2px rgba(217,155,0,.12)}
    .sb-klas-btn.has-test.active{background:#6b5d52;border-color:#ffc928;box-shadow:0 0 0 3px rgba(255,201,40,.35)}
    .sb-test-badge{display:inline-block;margin-left:3px;font-size:12px;line-height:1}

    /* schooljaar input */
    .sb-schooljaar{padding:12px 14px 4px}
    .sb-schooljaar label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
    .sb-schooljaar input{
      width:100%;border:1px solid var(--line);border-radius:10px;
      padding:7px 10px;font-size:13px;background:#fff;
    }

    /* ── MAIN ── */
    #main{flex:1;overflow-y:auto;padding:22px 24px 48px;display:flex;flex-direction:column;gap:0}

    /* content panels */
    button,.pill,select,input,textarea{font:inherit}
    button,.pill{border:0;border-radius:16px;background:#edf2f8;color:var(--ink);padding:10px 16px;font-weight:800;cursor:pointer}
    button.primary,.pill.saved{background:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow-dark)}
    button.green{background:var(--green);color:#0b2341}
    button.pink{background:var(--pink);color:#0b2341}
    button.danger{background:#f6bec6;color:#0b2341}
    button.white{background:#fff;border:1px solid var(--line)}
    button.small{padding:6px 10px;border-radius:12px;font-size:13px}
    h1{font-size:26px;margin:0 0 6px}
    h2{font-size:20px;margin:0 0 8px}
    h3{font-size:16px;margin:0 0 8px}
    p{margin:0 0 10px}
    .muted{color:var(--muted)}
    .small{font-size:13px}
    .strong{font-weight:800}
    input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
    input[type="checkbox"]{width:18px;height:18px;padding:0;margin:0;vertical-align:middle;accent-color:#2f8f67}
    td input[type="checkbox"],th input[type="checkbox"]{display:block;margin:0 auto}
    .refter-afwezig-vak{display:inline-flex!important;align-items:center;justify-content:center;width:24px;height:24px;margin:0!important;cursor:pointer;position:relative}
    .refter-afwezig-vak input{position:absolute;opacity:0;width:1px!important;height:1px!important;pointer-events:none}
    .refter-afwezig-teken{display:flex;align-items:center;justify-content:center;width:21px;height:21px;border:2px solid #8b98a8;border-radius:5px;background:#fff;color:#fff;font-size:19px;font-weight:900;line-height:1}
    .refter-afwezig-vak input:checked + .refter-afwezig-teken{background:#d74747;border-color:#a82525}
    .refter-afwezig-vak input:checked + .refter-afwezig-teken::after{content:'×';transform:translateY(-1px)}
    .refter-afwezig-vak input:focus-visible + .refter-afwezig-teken{outline:3px solid #86b7e7;outline-offset:2px}
    .refter-afwezig-vak:has(input:disabled){cursor:not-allowed;opacity:.78}
    .refter-week-table{width:100%;min-width:720px;table-layout:fixed}
    .refter-week-table col.refter-name-col{width:35%!important}
    .refter-week-table col.refter-day-col{width:13%!important}
    .refter-week-table th.day,.refter-week-table td.day{text-align:center;vertical-align:middle}
    .refter-week-nav{display:flex!important;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 8px;padding:10px 12px;background:#f5f8fb;border:1px solid #cbd8e6;border-radius:12px}
    .refter-week-nav label{flex:0 0 230px!important;max-width:230px!important;margin:0}
    .refter-week-nav button{white-space:nowrap;margin-bottom:1px}
    .refter-week-titel{margin:0 0 8px!important;padding:9px 12px!important}
    .refter-deadline-alert{margin:14px 0 10px!important;padding:18px 20px!important;background:#fff1ee!important;border:3px solid #c9362b!important;border-left-width:10px!important;box-shadow:0 8px 22px rgba(139,31,25,.18)}
    .refter-deadline-alert .refter-deadline-kop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;color:#8b1f19}
    .refter-deadline-alert .refter-deadline-datum{display:inline-block;padding:4px 10px;border-radius:999px;background:#c9362b;color:#fff;font-size:14px;font-weight:900}
    .refter-deadline-alert p{margin:8px 0 12px;color:#4b2522;font-size:16px;line-height:1.45}
    .refter-deadline-alert button{background:#c9362b;color:#fff;box-shadow:0 2px 0 #8b1f19}
    .refter-confirmatie{margin:14px 0 10px!important;padding:16px 18px!important;background:#eef8f1!important;border:2px solid #4b9a68!important}
    .refter-confirmatie strong{color:#1f6b3c}
    .refter-free-form{margin:0 0 10px!important;background:#fff8e6!important;border-color:#e2ae43!important}
    .refter-free-form-inhoud{padding:12px 14px 14px}
    .refter-geen-knop{background:#fff1c7!important;border-color:#e2ae43!important;color:#704d08!important}
    input.absence-check{
      appearance:none;-webkit-appearance:none;width:22px!important;height:22px!important;
      border:2px solid #8b98a8;border-radius:5px;background:#fff;cursor:pointer;
    }
    input.absence-check:checked{
      background-color:#d74747;border-color:#a82525;
      background-image:linear-gradient(45deg,transparent 43%,#fff 44%,#fff 56%,transparent 57%),linear-gradient(-45deg,transparent 43%,#fff 44%,#fff 56%,transparent 57%);
    }
    input.absence-check:focus-visible{outline:3px solid #86b7e7;outline-offset:2px}
    input.absence-check:disabled{cursor:not-allowed;opacity:.78}
    .check-label{display:inline-flex!important;align-items:center;gap:8px;margin:10px 0!important}
    .check-label input[type="checkbox"]{flex:0 0 auto}
    textarea{min-height:96px;resize:vertical}
    .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
    .notice{background:#fff8d6;border:1px solid #f2c94c;border-radius:14px;padding:14px;margin:12px 0}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
    table{border-collapse:collapse;width:100%;min-width:760px}
    th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:middle}
    th{background:#eef3f9;color:#536985;text-transform:uppercase;font-size:12px;letter-spacing:.03em}
    td.day,th.day{text-align:center;min-width:42px}
    .grey{background:#edf0f4;color:#91a0b5}
    .locked{background:#dcf5ea}
    .locked-head{background:#bcebdc!important;color:#0b2341}
    .colleague{background:#fff5c8}
    .tag{display:inline-block;border-radius:999px;background:#edf2f8;padding:4px 8px;font-size:12px;margin-left:6px}
    .tag.green{background:#d8f5e9}.tag.done{background:#c9efd9}
    .th-sub{display:block;margin-top:3px;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
    .homework-cell{min-width:245px;text-align:left!important}
    .homework-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:center}
    .homework-cell label{display:flex;align-items:center;justify-content:flex-start;gap:7px;margin:0;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
    .homework-cell label input[type="checkbox"]{display:inline-block!important;margin:0!important;flex:0 0 18px}
    .homework-day-choice{border:1px solid #c9d8e7;border-radius:9px;padding:7px 8px;background:#f7fafc}
    .homework-free-choice{grid-column:1/-1;border-top:1px solid var(--line);padding:7px 2px 0!important;margin-top:1px!important}
    .kolommen-kiezer{position:relative;margin-left:auto}
    .kolommen-kiezer summary{cursor:pointer;list-style:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#fff;font-weight:700;font-size:13px}
    .kolommen-kiezer[open] .kolommen-menu{display:grid}
    .kolommen-menu{position:absolute;right:0;top:40px;z-index:20;display:none;grid-template-columns:1fr 1fr;gap:8px 14px;min-width:330px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(11,35,65,.16)}
    .kolommen-menu label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap}
    .mf-klas { margin-bottom: 32px; }
    .mf-klas-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .mf-klas-header h3 { margin:0; font-size:1.15rem; }
    .mf-vaste-rij td { background:#fffbeb; }
    tfoot tr td { padding: 10px 12px; }
    .mf-tab-btn { padding:6px 16px; border:2px solid #d0d7de; border-radius:8px; background:#fff; cursor:pointer; font-weight:600; font-size:0.95rem; font-family:inherit; color:#444; }
    .mf-tab-btn:hover { background:#f0f4f8; }
    .mf-tab-active { background:#0a66c2 !important; color:#fff !important; border-color:#0a66c2 !important; }
    .teacher-lock{display:inline-block;margin-top:3px;font-size:13px}
    .status-dot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;font-weight:900}
    .status-dot.present{background:#dff7e8;color:#176f3b}
    .status-dot.absent{background:#ffd8d8;color:#b42318}
    .secretariaat-activiteiten{display:grid;gap:12px;margin-top:14px}
    .secretariaat-activiteit{border:1px solid #cbd8e6;border-radius:14px;background:#fff;overflow:hidden}
    .secretariaat-activiteit[open]{box-shadow:0 5px 16px rgba(11,35,65,.1)}
    .secretariaat-activiteit summary{list-style:none;cursor:pointer;padding:15px 18px;background:#eef4fa;display:flex;gap:12px;align-items:center;justify-content:space-between}
    .secretariaat-activiteit summary::-webkit-details-marker{display:none}
    .secretariaat-activiteit summary::after{content:'Openen ▾';font-weight:800;color:#315d82;white-space:nowrap}
    .secretariaat-activiteit[open] summary::after{content:'Sluiten ▴'}
    .secretariaat-activiteit.processed summary{background:#e3f4e9;border-left:7px solid #3d9660}
    .secretariaat-activiteit.pending summary{background:#fff5d4;border-left:7px solid #d6a523}
    .secretariaat-activiteit-body{padding:16px 18px}
    .activity-choice-dialog{width:min(560px,calc(100vw - 30px));border:0;border-radius:16px;padding:0;box-shadow:0 18px 55px rgba(10,25,45,.35);color:var(--ink)}
    .activity-choice-dialog::backdrop{background:rgba(18,29,43,.58)}
    .activity-choice-dialog-inhoud{padding:22px}
    .activity-choice-dialog h3{margin:0 0 8px;font-size:22px}
    .activity-choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    .activity-choice-actions button:last-child{grid-column:1/-1}
    @media(max-width:620px){.activity-choice-actions{grid-template-columns:1fr}.activity-choice-actions button:last-child{grid-column:auto}}
    .activiteit-tellingen{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0}
    .activiteit-telling{padding:6px 10px;border-radius:999px;font-weight:800;background:#e7f5ec;color:#176f3b}
    .activiteit-telling.afwezig{background:#ffe0e0;color:#a72d27}

      administratie: `<h3>Uitleg administratie</h3><ul><li><strong>Klaslijsten</strong>: leerlingen toevoegen, namen verbeteren, kind van collega aanduiden en uitschrijven.</li><li><strong>Vrije dagen</strong>: extra vrije dagen of studiedagen ingeven. Weekends en woensdagen zijn automatisch grijs.</li><li><strong>Meldingen</strong>: secretariaat stuurt taken naar klassen. Leerkrachten vinken aan wanneer het klaar is.</li><li><strong>Volgend schooljaar</strong>: pas op het einde van het jaar de bestaande leerlingen doorschuiven, uitzonderingen aanduiden en klasleerkrachten voor het nieuwe jaar koppelen.</li></ul>`,
      klaslijst: `<h3>Uitleg klaslijst</h3><ul><li>Met <strong>Klaslijst als Word</strong> download je een genummerd invulblad om af te drukken, bijvoorbeeld om tijdens het verbeteren tijdelijk punten te noteren.</li><li>Gebruik <strong>Klaslijst plakken</strong> vooral bij een volledig nieuwe klas.</li><li>Gebruik <strong>Nieuwe leerling</strong> voor een leerling die later start of nog ontbreekt.</li><li>Een hier toegevoegde leerling verschijnt ook in afwezigheden, etiketten en andere gekoppelde tools. Bestaande overgangsfiches worden niet overschreven; alleen de ontbrekende naam wordt toegevoegd.</li><li><strong>Standaard</strong> betekent: startdatum 1/09 van het schooljaar en einddatum 30/06 van dat schooljaar.</li><li>Namen kan je rechtstreeks in de tabel verbeteren.</li><li>Uitschrijven bewaart oudere gegevens voor lijsten en afrekeningen.</li></ul>`,
      refter: `<h3>Uitleg refter</h3><ul><li>Je ziet telkens één schoolweek van maandag tot en met vrijdag.</li><li>Leerkrachten vinken enkel kinderen aan die afwezig zijn. Een leeg vakje betekent aanwezig.</li><li>Controleer de afgelopen schoolweek uiterlijk vóór de verwerking op woensdag.</li><li>Secretariaat opent iedere klas en klikt bij die week op <strong>Deze schoolweek verwerken en vergrendelen</strong>.</li><li>Daarna staat de hele week op slot bij klas- en zorgleerkrachten. Alleen secretariaat kan nog corrigeren of de verwerking ongedaan maken.</li><li>Vakanties en pedagogische studiedagen uit de jaarkalender zijn automatisch grijs. Kinderen van collega's betalen geen refter.</li></ul>`,
      activiteiten: `<h3>Uitleg activiteiten</h3><ul><li>Leerkrachten kunnen een activiteit voor hun eigen klas toevoegen. Secretariaat kan dezelfde activiteit in één keer voor meerdere klassen aanmaken.</li><li>Gebruik dit alleen voor echte activiteiten of uitstappen. Oudercontacten, rapporten en infoavonden horen hier niet thuis.</li><li><strong>Kleuterzwemmen:</strong> zodra “zwemmen” wordt herkend, stelt de tool automatisch &euro;1,00 per leerling voor. Secretariaat kan de prijs controleren bij <strong>Administratie → Jaarkalender en activiteiten</strong>.</li><li><strong>Vink uitsluitend de afwezige leerlingen aan.</strong> Niet-aangevinkte leerlingen worden automatisch als aanwezig beschouwd.</li><li>Klik daarna op <strong>Afwezigheden nagekeken en bevestigen</strong>. Ook als niemand afwezig was, moet je één keer bevestigen.</li><li>Gaat een activiteit niet door? Klik op <strong>Annuleren</strong> en vul verplicht een reden in, bijvoorbeeld bij kleuterzwemmen: <em>te voet gegaan in plaats van met de bus</em>. De activiteit wordt dan niet aangerekend.</li><li>Wanneer secretariaat de activiteit verwerkt, kan de leerkracht ze niet meer wijzigen.</li></ul>`,

    function maandNaam(month){
      const d=new Date(`${month}-15T12:00:00`);

    }
    function maandStatus(bron,month){
      bron ||= {};
      const activiteiten=(bron.activiteiten||[]).filter(a=>!a.cancelled&&String(a.date||"").slice(0,7)===month);
      const activiteitOpen=activiteiten.filter(a=>a.attendanceConfirmed&&!a.processed).length;
      const aankopen=(bron.aankopen||[]).filter(p=>String(p.date||"").slice(0,7)===month);
      const aankoopOpen=aankopen.filter(p=>!p.processed).length;
      const refterMaand=bron.refter?.[month]||{};
      const refterDatums=new Set();
      Object.values(refterMaand).forEach(perLeerling=>Object.entries(perLeerling||{}).forEach(([datum,afwezig])=>{if(afwezig)refterDatums.add(datum)}));
      const refterOpen=[...refterDatums].filter(datum=>{
        const week=maandagVan(datum),weken=bron.processed?.refterWeken||{};
        if(weken[week])return false;
        const legacy=bron.processed?.refter||"";
        return !legacy||datum>legacy;
      }).length;
      const verwerkteRefterWeken=Object.keys(bron.processed?.refterWeken||{}).filter(week=>Array.from({length:5},(_,i)=>datumPlusDagen(week,i)).some(d=>d.slice(0,7)===month)).length;
      return {refterOpen,activiteitOpen,aankoopOpen,totaal:refterOpen+activiteitOpen+aankoopOpen,
        activiteitAantal:activiteiten.length,aankoopAantal:aankopen.length,refterAantal:refterDatums.size+verwerkteRefterWeken};
    }

      return "nog niets ingevuld";

      const bron=new Map(liveKlasDocumenten);if(data)bron.set(activeClass,data);
      const month=schoolMonths().includes(opvolgMaand)?opvolgMaand:huidigeSchoolMaand();opvolgMaand=month;
      const kaart=(soort,icoon,titel)=>`<section class="notice"><h3>${icoon} ${titel}</h3><p class="muted">Open een klas voor ${esc(maandNaam(month))}. Geel betekent dat er nog iets verwerkt moet worden.</p><div class="actions">${allClasses.map(k=>{const s=maandStatus(bron.get(k),month),open=s[`${soort}Open`]||0,aantal=s[`${soort}Aantal`]||0;return`<button class="${open?'heeft-open':'white'}" onclick="openOpvolgingKlas('${k}','${soort}','${month}')">${open?'● ':aantal?'✓ ':''}${k}${open?` — ${open} nieuw`:aantal?' — bekeken':''}</button>`}).join("")}</div></section>`;
      $("content").innerHTML=`<div class="panel"><div class="bar"><div><h2>Schoolbreed opvolgen</h2><p class="muted">Kies een maand en doorloop daarna alle klassen voor Refter, Activiteiten of Aankopen. Ook verwerkte lijsten blijven openklikken.</p></div><label style="max-width:220px">Maand<select onchange="kiesOpvolgMaand(this.value)">${schoolMonths().map(m=>`<option value="${m}" ${m===month?'selected':''}>${esc(maandNaam(m))}</option>`).join("")}</select></label></div><div class="opvolg-keuzes">${kaart('refter','🍽️','Refterlijsten')}${kaart('activiteit','🚌','Activiteiten')}${kaart('aankoop','🛍️','Aankopen')}</div></div>`;
    }
    window.kiesOpvolgMaand=month=>{opvolgMaand=month;renderOpvolging()};
    window.openOpvolgingKlas=async(klas,soort,month)=>{await openClass(klas,true);openMaandOnderdeel(soort==="activiteit"?"activiteiten":soort==="aankoop"?"aankopen":soort,month,true)};

    function render(){
      if(!data) return;
      if(!isSecretary() && tab === "administratie") tab = "klaslijst";
      if(isSecretary() && tab === "klaslijst") tab = "administratie";
      werkRustigeSecretariaatSidebarBij();
      setActiveNav(tab==="leerlingenstart"?"leerlingen":tab);
      renderMessages();
      if(tab==="administratie") renderAdmin();
      if(tab==="klaslijst") renderClassList();
      if(tab==="refter") renderRefter();
      if(tab==="activiteiten") renderActivities();
      if(tab==="aankopen") renderPurchases();
      if(tab==="maximumfactuur") renderMaximumfactuur();
      if(tab==="oudsten") renderOudstenOverzicht();
      if(tab==="klasstart") renderKlasStart();
      if(tab==="leerlingenstart") renderLeerlingenStart();
      if(tab==="leerlingen") renderLeerlingenSecretariaat();
      if(tab==="opvolging") renderOpvolging();
    }

    // ── MAXIMUMFACTUUR (code ook beschikbaar in maximumfactuur.js) ──
    // Standaardlimieten - worden overschreven door Firestore-instellingen
    const MF_LIMIET_STANDAARD = { lager: 105, kleuter: 55 };

    function isKleuterklas(klas) {
      // Klassen die beginnen met K (K1, K2, K3...) zijn kleuterklassen
      return /^K/i.test(klas || "");
    }

    function mfLimietVoorKlas(klas) {
      const l = mfLimiet();
      return isKleuterklas(klas) ? l.kleuter : l.lager;
    }

    function mfLimiet() {
      const inst = window._mfInstellingen || {};
      return {
        lager:   Number(inst.limLager   ?? MF_LIMIET_STANDAARD.lager),
        kleuter: Number(inst.limKleuter ?? MF_LIMIET_STANDAARD.kleuter)
      };
    }

    async function laadMfInstellingen() {
      try {
        const ref = doc(db, "schoolbeheer", schooljaar, "instellingen", "maximumfactuur");
        const snap = await getDoc(ref);
        window._mfInstellingen = snap.exists() ? snap.data() : {};
      } catch(e) {
        window._mfInstellingen = {};
      }
    }

    async function slaaMfInstellingenOp(inst) {
      try {
        const ref = doc(db, "schoolbeheer", schooljaar, "instellingen", "maximumfactuur");
        await setDoc(ref, { ...inst, bijgewerktOp: new Date().toISOString() });
        window._mfInstellingen = inst;
      } catch(e) {
        alert("Kon instellingen niet bewaren: " + e.message);
      }
    }

    async function renderMaximumfactuur() {
      const el = $("content");
      if (!data) return;
      el.innerHTML = `<div class="panel"><h2>&#128179; Maximumfactuur</h2><p class="muted">Laden...</p></div>`;

      // Laad instellingen (limieten) eerst
      await laadMfInstellingen();
      const limiet = mfLimiet();

      // Secretariaat laadt alle klassen, leerkracht enkel eigen klas
      const teladenKlassen = canOpenAllClasses()
        ? [...allClasses]
        : [activeClass];

      // Haal data op voor elke klas
      const klassenData = {};
      await Promise.all(teladenKlassen.map(async klas => {
        try {
          const snap = await getDoc(classRef(klas));
          klassenData[klas] = snap.exists() ? snap.data() : null;
        } catch(e) {
          klassenData[klas] = null;
        }
      }));

      // Render
      const sj = schooljaar || "";
      const [sj1, sj2] = (sj || "-").split("-");
      const periodeLabel = sj1 && sj2 ? `september ${sj1} tot en met juni ${sj2}` : "dit schooljaar";

      function renderKlasFactuurHtml(klas, kd, sj, limiet) {
        if (!kd) return `<div class="mf-klas"><h3>Klas ${esc(klas)}</h3><p class="muted">Geen data beschikbaar.</p></div>`;

        const activiteiten = [...(kd.activiteiten || [])]
          .filter(a => !a.cancelled && (a.naam || a.name) && Number(a.prijs || a.price || 0) > 0)
          .sort((a, b) => (a.datum || a.date || "").localeCompare(b.datum || b.date || ""));
        const vastePosten = kd.vastePosten || [];
        const totaal = [...vastePosten, ...activiteiten].reduce((s, p) => s + Number(p.prijs || p.price || 0), 0);
        const _lim = mfLimietVoorKlas(klas);
        const resterend = _lim - totaal;
        const over = totaal > _lim;

        return `
          <div class="mf-klas" id="mf-klas-${esc(klas)}">
            <div class="mf-klas-header">
              <h3>Klas ${esc(klas)}</h3>
              <button class="secondary small no-print" onclick="mfAfdrukken('${esc(klas)}')">&#128196; PDF downloaden</button>
            </div>
            <p class="muted" style="margin-bottom:8px;font-size:13px">Overzicht activiteiten van ${esc(periodeLabel)}</p>
            <div class="table-wrap">
              <table>
                <thead><tr>
                  <th style="width:55%">Omschrijving</th>
                  <th style="width:18%">Kostprijs</th>
                  <th style="width:20%">Datum</th>
                  <th style="width:7%" class="no-print"></th>
                </tr></thead>
                <tbody>
                  ${vastePosten.map((p, i) => `
                    <tr class="mf-vaste-rij">
                      <td><em>${esc(p.naam)}</em></td>
                      <td>&euro;&nbsp;${Number(p.prijs).toFixed(2)}</td>
                      <td>${esc(p.datum || "Schooljaar " + sj)}</td>
                      <td class="no-print">
                        <button class="ghost small" style="color:#c0392b" onclick="mfVasteVerwijderen('${esc(klas)}',${i})" title="Verwijderen">&#10005;</button>
                      </td>
                    </tr>`).join("")}
                  ${activiteiten.map(a => `
                    <tr>
                      <td>${esc(a.naam || a.name)}</td>
                      <td>&euro;&nbsp;${Number(a.prijs || a.price || 0).toFixed(2)}</td>
                      <td>${esc(a.datum || a.date || "")}</td>
                      <td class="no-print"></td>
                    </tr>`).join("")}
                  ${vastePosten.length === 0 && activiteiten.length === 0
                    ? `<tr><td colspan="4" style="color:#9ca3af;text-align:center;padding:16px">Nog geen posten voor deze klas.</td></tr>`
                    : ""}
                </tbody>
                <tfoot>
                  <tr style="background:${over ? "#fde8e8" : "#edfbea"}">
                    <td><strong>Totaal aan uitgaven</strong></td>
                    <td><strong>&euro;&nbsp;${totaal.toFixed(2)}</strong></td>
                    <td colspan="2">
                      ${over
                        ? `<span class="tag" style="background:#c0392b;color:#fff">&#9888; Limiet overschreden met &euro;${Math.abs(resterend).toFixed(2)}</span>`
                        : `<span class="tag" style="background:#27ae60;color:#fff">Nog &euro;${resterend.toFixed(2)} beschikbaar</span>`}
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
            <div class="no-print" style="background:#f8f9fa;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:10px">
              <p style="font-weight:700;margin:0 0 8px">Vaste post toevoegen</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
                <input type="text" id="mfNaam-${esc(klas)}" placeholder="Omschrijving (bv. Digitale tools)" style="flex:2;min-width:160px">
                <input type="number" id="mfPrijs-${esc(klas)}" placeholder="Prijs (€)" step="0.01" min="0" style="flex:0.8;min-width:90px">
                <input type="text" id="mfDatum-${esc(klas)}" placeholder="Datum / periode" style="flex:1.2;min-width:120px">
                <button class="primary small" onclick="mfVasteToevoegen('${esc(klas)}')">+ Toevoegen</button>
              </div>
            </div>
          </div>`;
      }

      // Instellingen-sectie (alleen secretariaat)
      const instHtml = isSecretary() ? `
        <div class="mf-instellingen no-print" style="background:#f0f4ff;border:1.5px solid #c7d2fe;border-radius:10px;padding:14px 18px;margin-bottom:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div>
              <strong style="font-size:1rem">&#9881; Maximumfactuur limieten</strong>
              <span class="muted" style="margin-left:8px;font-size:13px">Gelden voor het volledige schooljaar</span>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
              <label style="display:flex;flex-direction:column;gap:3px;font-size:13px">
                Kleuter (&euro;)
                <input type="number" id="mfLimKleuter" value="${limiet.kleuter}" min="0" step="0.50" style="width:90px">
              </label>
              <label style="display:flex;flex-direction:column;gap:3px;font-size:13px">
                Lager onderwijs (&euro;)
                <input type="number" id="mfLimLager" value="${limiet.lager}" min="0" step="0.50" style="width:110px">
              </label>
              <button class="primary small" onclick="mfSlaLimietenOp()">Bewaren</button>
            </div>
          </div>
        </div>` : "";

      // Bepaal actieve klas voor tabweergave
      if (!window._mfActieveKlas || !teladenKlassen.includes(window._mfActieveKlas)) {
        window._mfActieveKlas = teladenKlassen[0];
      }
      const aktKlas = window._mfActieveKlas;

      // Tabbladenrij
      const tabsHtml = canOpenAllClasses() ? `
        <div class="mf-tabs no-print" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
          ${teladenKlassen.map(k => `<button class="mf-tab-btn ${k === aktKlas ? 'mf-tab-active' : ''}" onclick="mfWisselKlas('${esc(k)}')">${esc(k)}</button>`).join("")}
        </div>` : "";

      el.innerHTML = `
        <div class="panel">
          <div class="bar">
            <div>
              <h2>&#128179; Maximumfactuur</h2>
              <p class="muted">Activiteiten worden automatisch ingeladen. Voeg vaste posten toe (bv. digitale tools). Limiet: <strong>&euro;${limiet.kleuter} kleuter</strong> / <strong>&euro;${limiet.lager} lager</strong>.</p>
            </div>
            ${canOpenAllClasses() ? `<button class="secondary no-print" onclick="mfAllesAfdrukken()">&#128424; Alle klassen afdrukken</button>` : ""}
          </div>
          ${instHtml}
          ${tabsHtml}
          ${renderKlasFactuurHtml(aktKlas, klassenData[aktKlas], schooljaar, limiet)}
        </div>`;

      window._mfKlassenData = klassenData;
      window._mfKlassen = teladenKlassen;


    }

    window.mfVasteToevoegen = async function(klas) {
      const naam = document.getElementById(`mfNaam-${klas}`)?.value?.trim();
      const prijs = Number(document.getElementById(`mfPrijs-${klas}`)?.value || 0);
      const datum = document.getElementById(`mfDatum-${klas}`)?.value?.trim();
      if (!naam) return alert("Vul een omschrijving in.");
      const snap = await getDoc(classRef(klas));
      const kd = snap.exists() ? snap.data() : {};
      if (!Array.isArray(kd.vastePosten)) kd.vastePosten = [];
      kd.vastePosten.push({ naam, prijs, datum: datum || "" });
      kd.bijgewerktOp = new Date().toISOString();
      await setDoc(classRef(klas), kd);
      renderMaximumfactuur();
    };

    window.mfVasteVerwijderen = async function(klas, index) {
      if (!confirm("Vaste post verwijderen?")) return;
      const snap = await getDoc(classRef(klas));
      if (!snap.exists()) return;
      const kd = snap.data();
      if (!Array.isArray(kd.vastePosten)) return;
      kd.vastePosten.splice(index, 1);
      kd.bijgewerktOp = new Date().toISOString();
      await setDoc(classRef(klas), kd);
      renderMaximumfactuur();
    };

    window.mfWisselKlas = function(klas) {
      window._mfActieveKlas = klas;
      renderMaximumfactuur();
    };

    window.mfSlaLimietenOp = async function() {
      const kleuter = Number(document.getElementById("mfLimKleuter")?.value ?? 55);
      const lager   = Number(document.getElementById("mfLimLager")?.value   ?? 105);
      if (isNaN(kleuter) || isNaN(lager) || kleuter < 0 || lager < 0) return alert("Vul geldige bedragen in.");
      await slaaMfInstellingenOp({ limKleuter: kleuter, limLager: lager });
      renderMaximumfactuur();
    };

    window.mfAfdrukken = function(klas) {
      const kd = window._mfKlassenData?.[klas];
      if (kd) mfDownloadPDF([klas], { [klas]: kd });
      else alert("Data niet geladen. Probeer opnieuw.");
    };

    window.mfAllesAfdrukken = function() {
      const klassen = window._mfKlassen;
      const klassenData = window._mfKlassenData;
      if (!klassen || !klassenData) { alert("Data niet geladen. Probeer opnieuw."); return; }
      mfDownloadPDF(klassen, klassenData);
    };

    async function mfDownloadPDF(klassen, klassenData) {
      // Controleer of jsPDF beschikbaar is
      if (typeof window.jspdf === "undefined") {
        alert("PDF-library niet geladen. Zorg dat jspdf.umd.min.js in dezelfde map staat als schoolbeheer.html.");
        return;
      }
      const { jsPDF } = window.jspdf;

      const sj = schooljaar || "";
      const delen = (sj || "-").split("-");
      const sj1 = delen[0] || "", sj2 = delen[1] || "";
      const periodeLabel = (sj1 && sj2) ? ("september " + sj1 + " tot en met juni " + sj2) : "dit schooljaar";
      const limiet = mfLimiet();
      const logoUrl = "afbeeldingen/schoollogo.png";

      // Logo ophalen als base64
      var logoBase64 = null;
      try {
        var resp = await fetch(logoUrl);
        if (resp.ok) {
          var buf = await resp.arrayBuffer();
          var bytes = new Uint8Array(buf);
          var binary = "";
          bytes.forEach(function(b) { binary += String.fromCharCode(b); });
          logoBase64 = "data:image/png;base64," + btoa(binary);
        }
      } catch(e) {}

      function prijsStr(bedrag) {
        return "\u20ac " + Number(bedrag).toFixed(2).replace(".", ",");
      }

      var doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      var BLAUW = [26, 82, 118];
      var LICHTBLAUW = [213, 232, 240];
      var GRIJS = [248, 249, 250];
      var GEEL = [255, 251, 235];
      var GROEN_BG = [240, 250, 240];
      var ROOD_BG = [253, 232, 232];
      var pageW = 210, pageH = 297;
      var marginL = 15, marginR = 15, contentW = pageW - marginL - marginR;

      klassen.forEach(function(klas, klasIdx) {
        if (klasIdx > 0) doc.addPage();

        var kd = klassenData[klas] || {};
        var activiteiten = (kd.activiteiten || []).filter(function(a) {
          return !a.cancelled && (a.naam || a.name) && Number(a.prijs || a.price || 0) > 0;
        }).sort(function(a, b) {
          return (a.datum || a.date || "").localeCompare(b.datum || b.date || "");
        });
        var vastePosten = kd.vastePosten || [];
        var totaal = 0;
        vastePosten.forEach(function(p) { totaal += Number(p.prijs || 0); });
        activiteiten.forEach(function(a) { totaal += Number(a.prijs || a.price || 0); });
        var totaalStr = Number(totaal).toFixed(2).replace(".", ",");
        var lim = mfLimietVoorKlas(klas);
        var resterend = lim - totaal;
        var over = totaal > lim;

        var y = 30;

        // Logo (verhouding bewaren: max breedte 35mm, max hoogte 16mm)
        if (logoBase64) {
          try {
            var imgProps = doc.getImageProperties(logoBase64);
            var logoMaxW = 35, logoMaxH = 16;
            var ratio = Math.min(logoMaxW / imgProps.width, logoMaxH / imgProps.height);
            var logoW = imgProps.width * ratio, logoH = imgProps.height * ratio;
            doc.addImage(logoBase64, "PNG", marginL, y - logoH, logoW, logoH, "", "FAST");
          } catch(e) {}
        }

        // Klas badge (blauw blok rechts)
        doc.setFillColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.roundedRect(pageW - marginR - 42, y - 14, 42, 14, 2, 2, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(13);
        doc.setFont("helvetica", "bold");
        doc.text("Klas: " + klas, pageW - marginR - 21, y - 6, { align: "center" });

        // Blauwe lijn
        y += 7;
        doc.setDrawColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.setLineWidth(0.8);
        doc.line(marginL, y, pageW - marginR, y);
        y += 7;

        // Periode
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text("Overzicht activiteiten van " + periodeLabel, marginL, y);
        y += 6;

        // Limiet tekst
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(100, 100, 100);
        doc.text("De maximumfactuur bedraagt \u20ac" + limiet.kleuter + " voor kleuters en \u20ac" + limiet.lager + " voor de lagere school.", marginL, y);
        y += 8;

        // Tabel header
        var col1 = contentW * 0.55, col2 = contentW * 0.22, col3 = contentW * 0.23;
        doc.setFillColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.rect(marginL, y, contentW, 8, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text("GEGEVENS", marginL + 2, y + 5.5);
        doc.text("KOSTPRIJS", marginL + col1 + 2, y + 5.5);
        doc.text("DATUM", marginL + col1 + col2 + 2, y + 5.5);
        y += 8;

        // Tabel rijen
        doc.setFont("helvetica", "normal");
        doc.setTextColor(30, 30, 30);
        var rijH = 7;
        var rijIdx = 0;

        function tekenRij(omschrijving, prijs, datum, isVaste) {
          var bg = isVaste ? GEEL : (rijIdx % 2 === 0 ? [255,255,255] : GRIJS);
          doc.setFillColor(bg[0], bg[1], bg[2]);
          doc.rect(marginL, y, contentW, rijH, "F");
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.2);
          doc.line(marginL, y + rijH, marginL + contentW, y + rijH);
          doc.setFontSize(9);
          if (isVaste) {
            doc.setFont("helvetica", "italic");
          } else {
            doc.setFont("helvetica", "normal");
          }
          doc.setTextColor(30, 30, 30);
          // Omschrijving - afkappen als te lang
          var maxOmschr = Math.floor(col1 / 2.2);
          var tekst = omschrijving.length > maxOmschr ? omschrijving.substring(0, maxOmschr - 2) + "..." : omschrijving;
          doc.text(tekst, marginL + 2, y + 4.8);
          doc.setFont("helvetica", "normal");
          doc.text(prijs, marginL + col1 + 2, y + 4.8);
          doc.text(datum, marginL + col1 + col2 + 2, y + 4.8);
          y += rijH;
          rijIdx++;
        }

        vastePosten.forEach(function(p) {
          tekenRij(p.naam || "", prijsStr(p.prijs || 0), p.datum || "Schooljaar " + sj, true);
        });
        activiteiten.forEach(function(a) {
          tekenRij(a.naam || a.name || "", prijsStr(a.prijs || a.price || 0), a.datum || a.date || "", false);
        });
        // 2 lege rijen
        tekenRij("", "", "", false);
        tekenRij("", "", "", false);

        // Totaal rij
        var totaalBg = over ? ROOD_BG : GROEN_BG;
        doc.setFillColor(totaalBg[0], totaalBg[1], totaalBg[2]);
        doc.rect(marginL, y, contentW, 9, "F");
        doc.setDrawColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.setLineWidth(0.5);
        doc.line(marginL, y, marginL + contentW, y);
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(30, 30, 30);
        doc.text("Totaal aan uitgaven", marginL + 2, y + 6);
        doc.text(totaalStr + " euro", marginL + col1 + 2, y + 6);
        // Badge
        if (over) {
          doc.setFillColor(231, 76, 60);
          doc.roundedRect(marginL + col1 + col2 + 1, y + 1, col3 - 2, 7, 2, 2, "F");
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(7.5);
          doc.text("Overschreden \u20ac" + Math.abs(resterend).toFixed(2).replace(".",","), marginL + col1 + col2 + col3/2, y + 5.5, { align: "center" });
        } else {
          doc.setFillColor(46, 204, 113);
          doc.roundedRect(marginL + col1 + col2 + 1, y + 1, col3 - 2, 7, 2, 2, "F");
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(7.5);
          doc.text("Nog \u20ac" + resterend.toFixed(2).replace(".",",") + " beschikbaar", marginL + col1 + col2 + col3/2, y + 5.5, { align: "center" });
        }
        y += 13;

        // Voetnoot
        doc.setFillColor(248, 249, 250);
        doc.setDrawColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.setLineWidth(0.6);
        doc.rect(marginL, y, contentW, 16, "F");
        doc.line(marginL, y, marginL, y + 16); // blauwe linkerlijn dik
        doc.setLineWidth(2);

    function messageIsLate(m){ return m.due && m.due < new Date().toISOString().slice(0,10) && !m.done && !m.archived; }
    function messageKey(m){ return m.groupId || m.id; }

    function renderMessages(){
      const vandaag = new Date().toISOString().slice(0,10);
      const zorgRol = ["zorgcoordinator","zorgleerkracht","beheerder"].includes(role);
      const activeMessages = (data.messages||[]).filter(m=>{
        if(m.archived) return false;
        if(m.visibleUntil && m.visibleUntil < vandaag) return false;
        if(!Array.isArray(m.targetClasses) && typeof m.targetCare === "undefined") return true;
        if(isSecretary()) return true;
        if(zorgRol) return m.targetCare === true;
        return (m.targetClasses||[]).includes(activeClass);
      });
      const openAantal=activeMessages.filter(m=>{
        const zorgStatus=zorgRol&&!isSecretary()?(m.careAcks?.[user.uid]?.status||""):"";
        const status=zorgStatus||(m.done||m.ackStatus==="done"?"done":m.ackStatus==="read"?"read":"");
        return m.responseType==="read"?!["read","done"].includes(status):status!=="done";
      }).length;
      if(!isSecretary()){
        try{
          if(openAantal&&navigator.setAppBadge)navigator.setAppBadge(openAantal).catch(()=>{});
          else if(navigator.clearAppBadge)navigator.clearAppBadge().catch(()=>{});
        }catch(_){}
      }
      const herstel = datumHerstelNotice();
      $("messages").innerHTML = herstel;
      const meldingHtml=activeMessages.map(m=>{
        const eigenZorgStatus=zorgRol&&!isSecretary()?(m.careAcks?.[user.uid]?.status||""):"";
        const huidigeStatus=eigenZorgStatus||(m.done||m.ackStatus==="done"?"done":m.ackStatus==="read"?"read":"");
        return `
        <div class="notice task-notice ${messageIsLate(m)?"message-card late":""}"><div class="bar">
          <div>
            <span class="tag" style="margin:0 6px 5px 0">Melding</span>
            <strong>${esc(m.text)}</strong>
            ${m.due?`<div class="muted">In orde tegen ${esc(m.due)}</div>`:""}
            ${m.visibleUntil?`<div class="muted">Blijft zichtbaar tot en met ${esc(m.visibleUntil)}</div>`:""}
            ${messageIsLate(m)?`<span class="tag pink">te laat</span>`:""}
            ${huidigeStatus==="done"?`<span class="tag done">in orde</span>`:huidigeStatus==="read"?`<span class="tag">gelezen</span>`:""}
          </div>
          ${isSecretary()?`<span class="right muted">${huidigeStatus==="done"?"Uitgevoerd":huidigeStatus==="read"?"Gelezen":m.responseType==="read"?"Nog niet gelezen":"Nog niet uitgevoerd"}</span>`:
          `<div class="message-actions right">${m.responseType==="read"?`<button class="small ${huidigeStatus==="read"?"green":"white"}" onclick="setMsgStatus('${m.id}','read')">Ik heb dit gelezen</button>`:`<button class="small ${huidigeStatus==="done"?"green":"white"}" onclick="setMsgStatus('${m.id}','done')">Ik heb dit uitgevoerd</button>`}</div>`}
        </div></div>`}).join("");
      const badge=$("meldingMenuAantal"),menu=$("meldingMenu");
      if(badge){badge.textContent=String(openAantal);badge.hidden=openAantal===0;}
      if(menu)menu.innerHTML=`<div id="meldingMenuKop"><strong>📣 Meldingen ${esc(activeClass)}</strong><button class="white small" onclick="toggleMeldingMenu(event,false)">Sluiten</button></div>${meldingHtml||'<p class="muted">Geen actieve meldingen voor deze klas.</p>'}`;
    }
    window.toggleMeldingMenu=(event,force)=>{event?.stopPropagation();const menu=$("meldingMenu"),knop=$("meldingMenuKnop");if(!menu)return;menu.hidden=typeof force==="boolean"?!force:!menu.hidden;knop?.setAttribute("aria-expanded",String(!menu.hidden));};
    document.addEventListener("click",event=>{const wrap=$("meldingMenuWrap"),menu=$("meldingMenu");if(wrap&&menu&&!wrap.contains(event.target)){menu.hidden=true;$("meldingMenuKnop")?.setAttribute("aria-expanded","false");}});
    window.setMsgStatus = (id,status) => {
      const m=data.messages.find(x=>x.id===id);
      const zorgRol=["zorgcoordinator","zorgleerkracht"].includes(role);
      if(m&&zorgRol){m.careAcks||={};m.careAcks[user.uid]={status,email:user.email||"",at:new Date().toISOString()};}
      else if(m){ m.ackStatus=status; m.done=status==="done"; m.readAt=status?new Date().toISOString():""; m.doneAt=status==="done"?new Date().toISOString():""; }
      markDirty(); renderMessages();
    };
    window.doneMsg = (id,checked) => {
      const m=data.messages.find(x=>x.id===id);
      if(m){ m.done=checked; m.doneAt=checked ? new Date().toISOString() : ""; }
      markDirty();
      renderMessages();
    };
    async function updateMessageInClasses(message, action){
      const key = messageKey(message);
      const fallbackText = message.text || "";
      const fallbackDue = message.due || "";
      for(const klas of allClasses){
        const ref = classRef(klas);
        const snap = await getDoc(ref);
        if(!snap.exists()) continue;
        const item = snap.data();
        item.messages ||= [];
        let changed = false;
        item.messages = item.messages.filter(m => {
          const same = messageKey(m) === key || (!message.groupId && m.text === fallbackText && m.due === fallbackDue);
          if(!same) return true;
          changed = true;
          if(action === "delete") return false;
          if(action === "archive") m.archived = true;
          if(action === "restore") m.archived = false;
          return true;
        });
        if(changed) await setDoc(ref,item);
      }
    }
    window.archiveMsg = async id => {
      const m=(data.messages||[]).find(x=>x.id===id);
      if(!m || !isSecretary()) return;
      await updateMessageInClasses(m, "archive");

      renderAdmin();
    };
    window.deleteMsg = async id => {

    function parseName(line){ line=line.trim(); if(!line)return null; if(line.includes(",")){ const [last,first]=line.split(","); return {last:last.trim(),first:first.trim()}; } const parts=line.split(/\s+/); return {first:parts.shift(),last:parts.join(" ")}; }

    function addStudentObj(last,first,colleague,start,roepnaam="",geboortejaar="",oudsteGezin=false){ if(!last||!first)return; if(data.leerlingen.some(s=>(s.last||"").toLowerCase()===last.toLowerCase()&&(s.first||"").toLowerCase()===first.toLowerCase()))return; data.leerlingen.push({id:uid(),last,first,roepnaam:String(roepnaam||"").trim(),geboortejaar:String(geboortejaar||"").trim(),oudsteGezin:!!oudsteGezin,colleague,start,end:endDate()}); }
    function normaliseerKolomNaam(value){
      return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"");
    }
    function waardeUitExcelRij(row, kolommen){
      const gezocht=new Set(kolommen.map(normaliseerKolomNaam));
      for(const [key,value] of Object.entries(row||{})){
        if(gezocht.has(normaliseerKolomNaam(key))) return String(value||"").trim();
      }
      return "";
    }
    function splitsNaamMetFamilienaamEerst(volledigeNaam){
      const delen=String(volledigeNaam||"").trim().split(/\s+/).filter(Boolean);
      if(delen.length<2)return {last:delen[0]||"",first:""};
      const eerste=delen[0].toLocaleLowerCase("nl"),tweede=(delen[1]||"").toLocaleLowerCase("nl");
      let aantal=1;
      if(["de","den","der","het","ten","ter","von"].includes(eerste))aantal=2;
      if(eerste==="van")aantal=["de","den","der","het"].includes(tweede)?3:2;
      if(["vande","vanden","vander"].includes(eerste))aantal=2;
      aantal=Math.min(aantal,delen.length-1);
      return {last:delen.slice(0,aantal).join(" "),first:delen.slice(aantal).join(" ")};
    }
    function excelRijNaarNaam(row){
      const klas=waardeUitExcelRij(row,["klas","klasgroep","groep","class"]);
      if(klas && klas.toUpperCase()!==activeClass.toUpperCase()) return null;
      const first=waardeUitExcelRij(row,["voornaam","voornamen","officielevoornaam","first","firstname"]);
      const last=waardeUitExcelRij(row,["achternaam","familienaam","naamfamilie","last","lastname"]);
      const roepnaam=waardeUitExcelRij(row,["roepnaam","gebruiktenaam","callingname"]);
      const geboorteWaarde=waardeUitExcelRij(row,["geboortejaar","geboorte jaar","geboren","birthyear","geboortedatum"]);
      const geboortejaar=(geboorteWaarde.match(/(?:19|20)\d{2}/)||[])[0]||"";
      if(first || last) return {first,last,roepnaam,geboortejaar,bron:"aparte kolommen"};
      const full=waardeUitExcelRij(row,["naam","leerling","leerlingnaam","volledigenaam","naam leerling"]);
      if(!full) return null;
      if(full.includes(",")){const [familie,...voornamen]=full.split(",");return {last:familie.trim(),first:voornamen.join(",").trim(),roepnaam:"",geboortejaar,bron:"één kolom met komma"};}
      const verdeeld=splitsNaamMetFamilienaamEerst(full);
      return {...verdeeld,roepnaam:"",geboortejaar,bron:"één kolom – samengestelde familienamen herkend; controleer"};
    }
    function csvNaarMatrix(tekst){
      tekst=String(tekst||"").replace(/^\uFEFF/,"");
      const eersteRegels=tekst.split(/\r?\n/).slice(0,12).join("\n");
      const delimiter=(eersteRegels.match(/;/g)||[]).length>=(eersteRegels.match(/,/g)||[]).length?";":",";
      const matrix=[];let rij=[],veld="",inAanhaling=false;
      for(let i=0;i<tekst.length;i++){
        const teken=tekst[i];
        if(teken==='"'){
          if(inAanhaling&&tekst[i+1]==='"'){veld+='"';i++;}else inAanhaling=!inAanhaling;
        }else if(teken===delimiter&&!inAanhaling){rij.push(veld);veld="";
        }else if((teken==='\n'||teken==='\r')&&!inAanhaling){
          if(teken==='\r'&&tekst[i+1]==='\n')i++;
          rij.push(veld);matrix.push(rij);rij=[];veld="";
        }else veld+=teken;
      }
      if(veld||rij.length){rij.push(veld);matrix.push(rij);}
      return matrix;
    }
    function matrixNaarExcelRijen(matrix){
      const herkenbareKoppen=new Set(["naam","leerling","leerlingnaam","volledigenaam","voornaam","voornamen","achternaam","familienaam","roepnaam","geboortejaar","geboortedatum"]);
      const kopRijIndex=matrix.findIndex(rij=>(rij||[]).some(cel=>herkenbareKoppen.has(normaliseerKolomNaam(cel))));
      if(kopRijIndex<0) throw new Error("De titelrij met Naam, Voornaam of Achternaam werd niet gevonden. Controleer of die kolomtitels in het bestand staan.");
      const koppen=(matrix[kopRijIndex]||[]).map((cel,index)=>String(cel||"").trim()||`Kolom ${index+1}`);
      return matrix.slice(kopRijIndex+1).map(rij=>{
        const object={};koppen.forEach((kop,index)=>object[kop]=rij?.[index]??"");return object;
      }).filter(row=>{
        const tekst=Object.values(row).map(v=>String(v||"").trim()).filter(Boolean).join(" ");
        return tekst&&!/^totaal\b/i.test(tekst)&&!/^aantal\b/i.test(tekst);
      });
    }
    async function leesCsvTekst(file){
      const buffer=await file.arrayBuffer();
      try{return new TextDecoder("utf-8",{fatal:true}).decode(buffer);}
      catch{return new TextDecoder("windows-1252").decode(buffer);}
    }
    async function leesExcelRijen(file){
      if(/\.csv$/i.test(file.name||"")) return matrixNaarExcelRijen(csvNaarMatrix(await leesCsvTekst(file)));
      if(typeof XLSX==="undefined") throw new Error("De Excel-lezer is niet geladen. Controleer de internetverbinding en herlaad de pagina.");
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:"array"});
      const sheetName=workbook.SheetNames[0];
      if(!sheetName) return [];
      const matrix=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,defval:"",raw:false});
      return matrixNaarExcelRijen(matrix);
    }

    async function dashboardLeerlingenVoorKlasUitLeerkrachten(){
      const klasDocId=`${schooljaar}_${activeClass}`;
      const rechtstreeks=await getDoc(doc(db,"klasleerkrachten",klasDocId));
      const koppelingen=[];
      if(rechtstreeks.exists()) koppelingen.push(rechtstreeks.data());
      if(!koppelingen.length){
        const snap=await getDocs(query(collection(db,"klasleerkrachten"),where("klas","==",activeClass)));
        snap.forEach(d=>{
          const item=d.data();
          if(String(item.schooljaar||schooljaar)===schooljaar) koppelingen.push(item);
        });
      }
      const uids=[...new Set(koppelingen.flatMap(k=>Array.isArray(k.leerkracht_uids)?k.leerkracht_uids:[]).filter(Boolean))];
      const namen=[];
      const bronnen=[];
      for(const uidValue of uids){
        const snap=await getDoc(doc(db,"leerkrachten",uidValue));
        if(!snap.exists()) continue;
        bronnen.push(uidValue);
        (snap.data().leerlingen||[]).forEach(l=>{
          const naam=String(l.naam||"").trim();
          if(naam) namen.push({naam,uid:uidValue});
        });
      }
      try{
        const klasQuery=await getDocs(query(collection(db,"leerkrachten"),where("klas","==",activeClass)));
        klasQuery.forEach(d=>{
          if(bronnen.includes(d.id)) return;
          const item=d.data();
          if(item.schooljaar && String(item.schooljaar)!==schooljaar) return;
          bronnen.push(d.id);
          (item.leerlingen||[]).forEach(l=>{
            const naam=String(l.naam||"").trim();
            if(naam) namen.push({naam,uid:d.id});
          });
        });
      }catch(e){
        console.warn("Dashboard zoeken op klasveld lukte niet", e);
      }
      return {namen,koppelingen,uids,bronnen};
    }
    function voegDashboardNamenToeAanKlasData(targetData,dashboardNamen){
      const bestaande=new Set((targetData.leerlingen||[]).map(s=>classNameKey(s.first||s.firstName,s.last||s.lastName)));
      let added=0, skipped=0;
      dashboardNamen.forEach(item=>{
        const row=schoolbeheerRijUitDashboardNaam(item.naam);
        if(!row||(!row.first&&!row.last)){ skipped++; return; }
        const key=classNameKey(row.first,row.last);
        if(!key||bestaande.has(key)){ skipped++; return; }
        bestaande.add(key);
        targetData.leerlingen.push({id:uid(),first:row.first,last:row.last,colleague:false,start:startDate(),end:endDate(),bron:"dashboard"});
        added++;
      });
      targetData.leerlingen.sort(vergelijkLeerlingen);
      return {added,skipped};

    function kalenderKlasVoorstel(tekst){
      const t=String(tekst||"").toLocaleLowerCase("nl"), set=new Set();
      for(const m of t.matchAll(/\bk\s*([123])\b/g)) set.add(`K${m[1]}`);
      for(const m of t.matchAll(/\bl\s*([1-6])\b/g)) set.add(`${m[1]}A`);
      if(/kleuters?|kleuterschool|\bks\b/.test(t)) ["K1","K2","K3"].forEach(k=>set.add(k));
      if(/(eerste|1ste|1e)\s*graad/.test(t)) ["1A","2A"].forEach(k=>set.add(k));
      if(/(tweede|2de|2e)\s*graad/.test(t)) ["3A","4A"].forEach(k=>set.add(k));
      if(/(derde|3de|3e)\s*graad/.test(t)) ["5A","6A"].forEach(k=>set.add(k));
      return [...set].filter(k=>allClasses.includes(k));
    }
    function kalenderSoort(tekst){
      const t=String(tekst||"").toLocaleLowerCase("nl");
      if(/vakantie|pedagogische studiedag|wapenstilstand|hemelvaart|brugdag|pinkstermaandag|dag van de arbeid/.test(t)) return "vrij";
      if(/oudercontact|rapport|infoavond|toets|schoolfotograaf|proclamatie|laatste huiswerkklas|infodag/.test(t)) return "overslaan";
      if(t.includes("zwemmen")) return kalenderKlasVoorstel(t).some(k=>/^K/.test(k)) ? "activiteit" : "overslaan";
      if(/toneel|film|rollebolle|musical|bingo|strapdag|uitstap|schoolreis/.test(t)) return "activiteit";
      return "overslaan";
    }
    function standaardActiviteitPrijs(tekst,classes=[]){
      const zwemmen=String(tekst||"").toLocaleLowerCase("nl").includes("zwemmen"),kleuters=!classes.length||classes.some(k=>/^K[123]$/.test(k));
      return zwemmen&&kleuters?1:0;
    }
    function isoKalenderDatum(year,month,day){

    function leesJaarkalenderMatrix(matrix){
      const start=Number(schooljaar.slice(0,4)), pairs=[[1,2,9,start],[3,4,10,start],[5,6,11,start],[7,8,12,start],[9,10,1,start+1],[11,12,2,start+1],[13,14,3,start+1],[15,16,4,start+1],[17,18,5,start+1],[19,20,6,start+1]], rows=[];
      for(const [dateCol,eventCol,month,year] of pairs){
        let day=0;
        for(let r=3;r<matrix.length;r++){
          const rawDay=String(matrix[r]?.[dateCol]??"").trim(), n=Number(rawDay.replace(",","."));
          if(Number.isInteger(n)&&n>=1&&n<=31) day=n;
          const text=String(matrix[r]?.[eventCol]??"").replace(/\s+/g," ").trim();
          if(!day||!text) continue;
          const type=kalenderSoort(text), date=isoKalenderDatum(year,month,day);
          if(type==="overslaan"||!date) continue;
          const classes=type==="vrij"?[...allClasses]:kalenderKlasVoorstel(text).filter(k=>!text.toLocaleLowerCase("nl").includes("zwemmen")||/^K/.test(k));
          rows.push({id:uid(),type,date,text,classes,price:type==="activiteit"?standaardActiviteitPrijs(text,classes):0,selected:true});
        }
      }
      return rows.filter((row,i,list)=>list.findIndex(x=>x.type===row.type&&x.date===row.date&&x.text.toLocaleLowerCase("nl")===row.text.toLocaleLowerCase("nl"))===i);
    }

    async function bewaarKalenderItems(items,meta={}){
      const perKlas=new Map();

    function renderWorkbooks(){ $("content").innerHTML = `<div class="panel"><div class="bar"><div><h2>Werkboeken</h2><p class="muted">Later uit te werken.</p></div>${screenTools("werkboeken")}</div>${helpPanel("werkboeken")}</div>`; }

    // Sidebar navigatie
    document.querySelectorAll(".sb-item").forEach(el => {
      el.addEventListener("click", () => {
        const vorigeTab = tab;
        tab = el.dataset.tab;
        if(isSecretary()&&tab==="leerlingen"){
          tab=activeClass&&data?"leerlingen":"leerlingenstart";
          adminPanel="klaslijsten";classListMode="";
        }
        if(tab === "refter" && vorigeTab !== "refter") gekozenRefterWeek = "";
        if(tab === "administratie" && isSecretary()){adminPanel = "wegwijzer";adminNavigatieOpen=false;secretariaatModulesOpen=false;}
        renderKlasPills();
        render();
      });
    });

    $("schooljaarInput").addEventListener("change", async () => {
      toonSchermLaden("Schooljaar laden…");
      schooljaar = $("schooljaarInput").value.trim() || schooljaar;
      await loadAllowedClasses();
      startTestOverzichtListener();
      activeClass = allowedClasses[0] || "";
      renderScope();
      if(activeClass) await openClass(activeClass, isSecretary());
      else verbergSchermLaden();
    });

    $("logoutBtn").addEventListener("click", () => signOut(auth).then(() => location.href="index.html"));

    onAuthStateChanged(auth, async authUser => {
      if(!authUser){ location.href="index.html"; return; }
      user = authUser;
      try{
        await loadRole();
        await loadAllowedClasses();
        startTestOverzichtListener();
        if(!isSecretary() && !allowedClasses.length){
          $("content").innerHTML = `<div class="panel"><h2>Geen klas gevonden</h2><p class="muted">Je account is nog niet gekoppeld in klasleerkrachten.</p></div>`;
          setStatus("Geen klas");
          return;
        }
        activeClass = allowedClasses[0] || DEFAULT_CLASSES[0];
        if(!isSecretary()&&new URLSearchParams(location.search).get("open")==="refter")tab="refter";
        if(isSecretary()){
          // Secretariaat werkt dagelijks vanuit de klasmappen. Leerlingenbeheer
          // blijft een afzonderlijk onderdeel dat alleen bewust wordt geopend.
          tab = "klasstart";
          adminPanel = "wegwijzer";
          classListMode = "";
          secretariaatModulesOpen = true;
        }
        renderScope();
        await openClass(activeClass, isSecretary());
      }catch(err){
        console.error(err);
        $("content").innerHTML = `<div class="panel"><h2>Laden mislukt</h2><p class="muted">${esc(err.message)}</p></div>`;
        setStatus("Fout");
      }
    });
  </script>

  <!-- Dubbele scrollbar: spiegel bovenaan elke table-wrap -->
  <script>
  function installScrollMirrors(){
    document.querySelectorAll('.table-wrap').forEach(wrap => {
      if(wrap.classList.contains('no-scroll-mirror')) return;
      const koppen = [...wrap.querySelectorAll('thead th')].map(th => th.textContent.trim().toLowerCase());
      if(koppen.includes('achternaam') && koppen.some(x => x.includes('officiële voornaam'))) wrap.classList.add('student-list-wrap');
      // Niet twee keer installeren
      if(wrap.previousElementSibling?.classList?.contains('scroll-mirror-top')) return;

      const mirror = document.createElement('div');
      mirror.className = 'scroll-mirror-top';
      const inner = document.createElement('div');
      mirror.appendChild(inner);
      wrap.parentNode.insertBefore(mirror, wrap);

      function syncWidth(){
        inner.style.width = wrap.scrollWidth + 'px';
      }
      syncWidth();

      let syncing = false;
      mirror.addEventListener('scroll', () => {
        if(syncing) return; syncing = true;
        wrap.scrollLeft = mirror.scrollLeft;
        syncing = false;
      });
      wrap.addEventListener('scroll', () => {
        if(syncing) return; syncing = true;
        mirror.scrollLeft = wrap.scrollLeft;
        syncWidth();
        syncing = false;
      });

      // Herinstalleer als de tabel herrenderd wordt (breedte kan wijzigen)
      new ResizeObserver(syncWidth).observe(wrap);
    });
  }

  // Na elke render opnieuw installeren
  const _origRender = window.__mirrorRenderHook;
  const observer = new MutationObserver(() => installScrollMirrors());
  document.addEventListener('DOMContentLoaded', () => {
    observer.observe(document.getElementById('content'), { childList: true, subtree: false });
    installScrollMirrors();
  });
  </script>
