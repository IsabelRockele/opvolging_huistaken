<body>
<header>
  <div class="brand"><img src="afbeeldingen/schoollogo.png" alt="logo" onerror="this.style.display='none'"><div><h1>Zorgoverleg</h1><div id="status" class="sub">Laden...</div></div></div>
  <div class="bar"><a class="button ghost" href="index.html">Keuzescherm</a><button id="logoutBtn" class="ghost">Uitloggen</button></div>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <label>Schooljaar<select id="schooljaarSelect"></select></label>
      <label>Klas<select id="klasSelect"></select></label>
      <label>Maand<select id="maandSelect"></select></label>
      <label class="titel-label">Titel overleg<input id="titelInput" placeholder="bv. Zorgoverleg oktober"><span id="titelSaveStatus" class="bewaarstatus-inline"></span></label>
      <button class="secondary" id="saveBtn">Bewaren</button>
      <button id="pdfBtn">PDF leerling</button>
    </div>
  </section>
  <section class="panel group-panel" id="groupPanel">
    <button type="button" class="group-toggle" id="groupToggle">
      <div>
        <strong>Gezamenlijke acties in deze klas</strong>
        <span>Open dit alleen wanneer je kinderen samen neemt rond dezelfde zorg of actie.</span>
      </div>
      <div class="group-arrow" id="groupArrow">+</div>
    </button>
    <div class="group-body">
      <div class="bar">
        <div class="muted">Noteer waarvoor de actie dient, klik de leerlingen aan en vul de afspraak of evaluatie aan.</div>
        <button class="white right" id="addGroupActionBtn">Actie toevoegen</button>
      </div>
      <div id="groupActions"></div>
    </div>
  </section>
  <section id="students"></section>
</main>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { probeerVeiligheidskopie } from "./firebase-veiligheid.js";
const firebaseConfig={apiKey:"AIzaSyA7KxXMvZ4dzBQDut3CMyWUblLte2tFzoQ",authDomain:"huiswerkapp-a311e.firebaseapp.com",projectId:"huiswerkapp-a311e",storageBucket:"huiswerkapp-a311e.appspot.com",messagingSenderId:"797169941164",appId:"1:797169941164:web:511d9618079f1378d0fd09"};
const app=getApps().length?getApp():initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const DEFAULT_CLASSES=["K1","K2","K3","1A","2A","3A","4A","5A","6A"], $=id=>document.getElementById(id);
const BEWAAR_JAREN_ZORGOVERLEG = 12; // Maximum: K1 tot einde lager onderwijs plus marge.
const BEWAAR_JAREN_PER_STARTKLAS = { K1:12, K2:11, K3:10, "1A":9, "2A":8, "3A":7, "4A":6, "5A":5, "6A":4 };
const EERSTE_APP_SCHOOLJAAR = "2025-2026";
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
let user=null, role="", schooljaar=huidigSchooljaar(), classes=[], activeKlas="", maand="", leerlingen=[], data={entries:{},groupActions:[]}, previousData={entries:{},groupActions:[]}, overlegHistoriek=[], zorgOverdracht={}, activeStudentIndex=0, activeField="werkhouding", fullFicheMode=false, faseVragenOpen=false;
async function setDoc(ref,payload,options){
  await probeerVeiligheidskopie(ref,{reden:"Zorgoverleg vóór opslag",schooljaar,klas:activeKlas,gebruiker:user?.email||user?.uid||""},(melding,err)=>{console.warn(melding,err);const status=document.getElementById("status");if(status)status.textContent="Let op: reservekopie mislukt";});
  return firestoreSetDoc(ref,payload,options);
}
function huidigSchooljaar(){const n=new Date(), y=n.getMonth()>=7?n.getFullYear():n.getFullYear()-1;return `${y}-${y+1}`;}
function bewaarTotVoorSchooljaar(jaar=schooljaar, extraJaren=BEWAAR_JAREN_ZORGOVERLEG){return `${Number(String(jaar).slice(0,4))+extraJaren}-08-31`;}
function bewaarJarenVoorKlas(klas){const key=String(klas||"").trim().toUpperCase();return BEWAAR_JAREN_PER_STARTKLAS[key]||BEWAAR_JAREN_ZORGOVERLEG;}
function schooljaarOpties(){
  const start=Number(huidigSchooljaar().slice(0,4));
  const eerste=Number(EERSTE_APP_SCHOOLJAAR.slice(0,4));
  return Array.from({length:Math.max(1,start+2-eerste)},(_,i)=>{const y=start+1-i;return `${y}-${y+1}`;}).filter(j=>Number(j.slice(0,4))>=eerste);
}
function isArchiefJaar(){return Number(schooljaar.slice(0,4))<Number(huidigSchooljaar().slice(0,4));}

function previousMonthId(){const months=schoolMonths(), i=months.indexOf(maand);return i>0?months[i-1]:"";}
function overlegPeildatum(){
  const vandaag=new Date().toISOString().slice(0,10), huidigeMaand=vandaag.slice(0,7);
  if(maand===huidigeMaand)return vandaag;

        if(!oud)continue;

          Object.entries(entry).forEach(([field,value])=>{if(value!==undefined&&value!==null&&String(value).trim()!=="")waarden[field]=value;});
          const acties=(snap.data()?.groupActions||[]).filter(g=>(g.studentKeys||[]).includes(oudKey));
          if(Object.keys(entry).some(field=>field!=="zorgfase"&&String(entry[field]||"").trim())||acties.length)laatsteMaand=maanden[index];
          acties.forEach(actie=>groepsacties.push(actie));
        });
        if(Object.keys(waarden).length||groepsacties.length)zorgOverdracht[key(student)]={bronJaar,bronKlas,laatsteMaand,waarden,groepsacties};

async function laadZorgGeschiedenisVoorLeerling(student){
  const targetKey=naamKey(naam(student));
  const jaren=vorigeSchooljaren();
  if(!jaren.length)return `<div class="muted">Er zijn nog geen vorige schooljaren in deze app.</div>`;
  const delen=[];
  for(const jaar of jaren){
    const klasSnap=await getDocs(collection(db,"schoolbeheer",jaar,"klassen"));
    const klassen=klasSnap.docs.map(d=>d.id);
    const maanden=[`${jaar.slice(0,4)}-09`,`${jaar.slice(0,4)}-10`,`${jaar.slice(0,4)}-11`,`${jaar.slice(0,4)}-12`,`${Number(jaar.slice(0,4))+1}-01`,`${Number(jaar.slice(0,4))+1}-02`,`${Number(jaar.slice(0,4))+1}-03`,`${Number(jaar.slice(0,4))+1}-04`,`${Number(jaar.slice(0,4))+1}-05`,`${Number(jaar.slice(0,4))+1}-06`];
    const items=[];
    for(const klas of klassen){
      const klasDoc=klasSnap.docs.find(d=>d.id===klas);
      const match=(klasDoc?.data()?.leerlingen||[]).find(s=>naamKey(naam(s))===targetKey);
      if(!match)continue;
      const studentKey=key(match);
      const snaps=await Promise.all(maanden.map(m=>getDoc(doc(db,"zorgoverleggen",jaar,"klassen",klas,"maanden",m))));
      snaps.forEach((snap,i)=>{
        if(!snap.exists())return;
        const entry=snap.data()?.entries?.[studentKey]||{};
        const filled=FIELD_TABS.map(([f,l])=>entry[f]?.trim()?`${l}: ${entry[f].trim()}`:"").filter(Boolean);
        if(filled.length)items.push({maand:maanden[i],klas,tekst:filled.join("\n\n")});
      });
    }
    if(items.length)delen.push(`<section class="history-year"><h3>${esc(jaar)}</h3>${items.map(it=>`<div class="history-item"><strong>${esc(maandLabel(it.maand))} - ${esc(it.klas)}</strong>\n${esc(it.tekst)}</div>`).join("")}</section>`);
  }
  return delen.length?delen.join(""):`<div class="muted">Geen zorgoverleg gevonden voor vorige schooljaren.</div>`;
}
